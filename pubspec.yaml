name: ev_yemen
description: EV Yemen electric vehicle services application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.7
  shared_preferences: ^2.5.3
  crypto: ^3.0.7
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/customer_car_detail.jpeg
    - assets/customer_station_detail.jpeg
    - assets/dealer_profile/vehicle_1.jpeg
    - assets/dealer_profile/vehicle_2.jpeg
    - assets/dealer_profile/vehicle_4.jpeg
    - assets/dealer_profile/vehicle_6.jpeg
    - assets/dealer_profile/vehicle_7.jpeg
    - assets/dealer_profile/figma_catalog_1.jpeg
    - assets/dealer_profile/figma_catalog_2.jpeg
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
